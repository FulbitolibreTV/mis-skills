<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #2b3a55; }
      #root { width: 100%; height: 100%; font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      #tarjeta { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; display: flex;
                 flex-direction: column; align-items: center; justify-content: center; gap: 48px; }
      #titulo { color: #ffffff; font-size: 120px; font-weight: 800; letter-spacing: -2px; }
      #sello { color: #2b3a55; background: #ffd166; font-size: 56px; font-weight: 800;
               padding: 18px 44px; border-radius: 20px; }
      #barra { width: 640px; height: 18px; border-radius: 9px; background: rgba(255,255,255,.25); overflow: hidden; }
      #lleno { width: 100%; height: 100%; background: #ffd166; transform-origin: left center; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2" data-width="1080" data-height="1920">
      <div id="tarjeta" class="clip" data-start="0" data-duration="2" data-track-index="0">
        <h1 id="titulo">Editor IA</h1>
        <div id="barra"><div id="lleno"></div></div>
        <div id="sello">listo ✓</div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#titulo", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo("#lleno", { scaleX: 0 }, { scaleX: 1, duration: 1.0, ease: "power2.inOut" }, 0.2);
      tl.fromTo("#sello", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2)" }, 1.2);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
